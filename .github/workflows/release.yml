name: 发布桌面应用

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '补发模式：填已有 tag（如 v1.2.0）则构建 main 并把安装包上传到该 tag 的 Release；留空则仅出 artifact'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node 22（npm 10）：npm 11 的 install-scripts allowlist 策略会拦截
          # electron 的 postinstall 与 npm rebuild，导致打包找不到 Electron 二进制
          node-version: 22
          cache: npm

      # electron 与 electron-builder 的下载缓存（NSIS 工具链、winCodeSign、electron zip）
      # Windows 上两者缓存在 ~/AppData/Local 下（~/.cache 是 Linux 约定）；
      # ms-playwright 同路径规律，给 OCR 门禁的 Chromium 复用（版本随 package-lock 变更而失效）
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - run: npm ci

      # electron 44.8.0 起 npm 包不再带 postinstall（scripts 为空，npm rebuild 无效），
      # 二进制需用官方入口 install.js 显式安装（bin: install-electron）
      - name: 安装 Electron 二进制
        shell: bash
        run: |
          if [ ! -f node_modules/electron/path.txt ]; then
            echo "安装 Electron 二进制（node node_modules/electron/install.js）"
            node node_modules/electron/install.js
          fi
          test -f node_modules/electron/path.txt
          node -p "'Electron ' + require('./node_modules/electron/package.json').version + ' -> ' + require('electron')"

      # 发布目标：tag push 用自身引用；手动触发时可指定补发到已有 tag
      - name: 计算发布标签
        id: reltag
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 校验标签与 package.json 版本一致
        if: steps.reltag.outputs.tag != ''
        shell: bash
        run: |
          tag="${{ steps.reltag.outputs.tag }}"
          version=$(node -p "require('./package.json').version")
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::标签 $tag 与 package.json 版本 $version 不一致（补发旧 tag 时请在该 tag 的源码上打包，或临时核对版本语义）"
            exit 1
          fi

      - name: 测试门禁
        run: npm test

      # OCR 主链路门禁：npm test 只覆盖后处理纯函数，这里在真实 Chromium 里
      # 跑完整链路（vendor Tesseract wasm + 语言包 + 识别 + 置信度断言）。
      # 浏览器缺失时 launchBrowser 会提示安装；装过则秒过（上面已缓存）
      - name: 安装 Chromium（OCR 门禁用）
        shell: bash
        run: npx playwright install chromium
      - name: OCR 主链路冒烟
        shell: bash
        run: node tools/verify-ocr.cjs

      - name: 打包
        shell: bash
        run: |
          if npm run dist > dist.log 2>&1; then
            tail -n 6 dist.log
          else
            # 未登录无法取回完整日志，失败时把结尾贴到作业摘要里
            { echo '### 打包失败（dist.log 结尾）'; echo '```'; tail -n 40 dist.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # 打包产物 E2E：启动真实 exe → 首页渲染 → 版本一致 → 桥接真身 → 7z 引擎 IPC 冒烟
      - name: 打包产物 E2E 冒烟
        shell: bash
        run: node tools/verify-packaged.cjs

      # 应用内更新器（electron-updater）从 Release 资产读取 latest.yml 并按其中的
      # 文件名下载——artifactName 已 ASCII 化，构建产物名与资产名天然一致；
      # blockmap 支持差分下载（仅下载增量），latest.yml 是更新检测的元数据
      - name: 发布到 GitHub Release
        if: steps.reltag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ steps.reltag.outputs.tag }}
        shell: bash
        run: |
          gh release view "$REL_TAG" >/dev/null 2>&1 \
            || gh release create "$REL_TAG" \
                 --title "浩玥工具箱 $REL_TAG" \
                 --generate-notes --target "$GITHUB_SHA"
          VER=$(node -p "require('./package.json').version")
          mkdir -p upload
          cp "release-build/haoyue-idphoto-Setup-$VER.exe" upload/
          cp "release-build/haoyue-idphoto-Setup-$VER.exe.blockmap" upload/
          cp "release-build/haoyue-idphoto-$VER-portable.exe" upload/
          cp "release-build/latest.yml" upload/
          gh release upload "$REL_TAG" upload/* --clobber

      # 手动触发且未指定补发 tag 时，不建 Release，只留产物供试装
      - name: 上传构建产物
        if: steps.reltag.outputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: haoyue-idphoto-windows
          path: release-build/*.exe
          if-no-files-found: error
