name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 语法检查与单元冒烟（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # 测试用例不启动 Electron，跳过其二进制下载（约 100MB）
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 语法检查（js / electron / tools）
        shell: bash
        run: |
          find js electron tools \( -name '*.js' -o -name '*.cjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: 单元与冒烟测试（含 index.html / 模型引用完整性）
        run: npm test
